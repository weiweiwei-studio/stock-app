<!DOCTYPE html>

    <style>
        /* iOS 基礎優化 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #fafaf9; 
            color: #44403c; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }
        
        .nav-active { background-color: #e7e5e4; color: #1c1917; font-weight: 700; }
        
        /* 增加點擊區域感應與視覺回饋 */
        .grid-item { 
            position: relative; 
            width: 52px; 
            height: 68px; 
            cursor: pointer !important; 
            background: white; 
            border-radius: 4px; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            touch-action: manipulation;
        }
        .grid-item:active { transform: scale(0.95); opacity: 0.8; }

        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 3px; }

        .photo-reel { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; max-width: 180px; }
        .reel-img { width: 36px; height: 48px; object-fit: cover; border-radius: 4px; border: 1px solid #e7e5e4; flex-shrink: 0; background: #fff; }
        
        .photo-grid { display: flex; flex-wrap: wrap; gap: 8px; max-width: 100%; }
        .grid-img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; border: 1px solid #e7e5e4; }
        
        /* 狀態標籤 - 增加 pointer-events: none 確保點擊穿透 */
        .status-badge { position: absolute; bottom: 0; right: 0; left: 0; padding: 2px 0; font-size: 8px; font-weight: bold; color: white; text-align: center; border-radius: 0 0 4px 4px; pointer-events: none; }
        .badge-sold { background-color: #1c1917; } 
        .badge-multi { background-color: #3b82f6; } 
        .badge-studio { background-color: #10b981; } 
        .badge-none { background-color: #e5e7eb; color: #9ca3af; border-top: 1px solid #d1d5db; }
        .sold-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; border-radius: 4px; pointer-events: none; }
        .has-note-dot { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%; border: 1px solid white; z-index: 10; pointer-events: none; }

        /* 彈窗 iOS 適配 */
        body.modal-open { overflow: hidden; height: 100vh; position: fixed; width: 100%; }
        #detail-modal { -webkit-overflow-scrolling: touch; }

        /* 行事曆 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: #e7e5e4; border: 1px solid #e7e5e4; width: 100%; }
        .calendar-header { background-color: #f5f5f4; color: #78716c; font-size: 11px; font-weight: bold; text-align: center; padding: 8px 0; }
        .calendar-cell { background-color: white; min-height: 80px; padding: 2px; position: relative; display: flex; flex-direction: column; }
        .cal-date-num { font-size: 10px; font-weight: bold; color: #a8a29e; text-align: center; }
        .cal-today .cal-date-num { color: #f59e0b; font-size: 12px; }
        .cal-item { font-size: 8px; padding: 2px; border-radius: 2px; color: white; margin-bottom: 1px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .maker-kim { background-color: #f472b6; }
        .maker-kelly { background-color: #60a5fa; }
        .maker-other { background-color: #a8a29e; }

        .animate-fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlB24yzUmGCqsPofuoYhWBiIUj7IWjybc",
            authDomain: "stock-planner-7ca50.firebaseapp.com",
            projectId: "stock-planner-7ca50",
            storageBucket: "stock-planner-7ca50.firebasestorage.app",
            messagingSenderId: "150326512952",
            appId: "1:150326512952:web:0396231677d9841929c5cd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const dbFirestore = getFirestore(app);
        const storage = getStorage(app);

        let db = [];
        let appSettings = { makers: [], locations: [], categories: [] };
        let currentDetailItem = null;
        let currentDetailPhotoIdx = -1;
        let tempLocations = [];
        let currentCalDate = new Date();
        let allocChart = null;
        let calendarMode = 'production';

        document.addEventListener('DOMContentLoaded', () => {
            const mInput = document.getElementById('form-month-input');
            if(mInput) mInput.value = new Date().toLocaleString('en-US', { month: 'short', year: 'numeric' });
            if(auth) {
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        document.getElementById('connection-status').innerText = "Connected";
                        document.getElementById('connection-status').classList.replace('bg-stone-100', 'bg-green-100');
                        startListeners();
                    } else {
                        signInAnonymously(auth);
                    }
                });
            }
            initChart();
        });

        function startListeners() {
            onSnapshot(doc(dbFirestore, "settings", "config"), (snap) => {
                if(snap.exists()) appSettings = { ...appSettings, ...snap.data() };
                updateDropdowns();
                renderSettingsView();
            });

            onSnapshot(collection(dbFirestore, "stock_items"), (snap) => {
                db = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                // Sort by createdAt desc
                db.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                
                updateDashboard();
                renderProductionList();
                renderAllocationList();
            });
        }

        // --- DASHBOARD ---
        function updateDashboard() {
            const total = db.reduce((s, i) => s + (parseInt(i.quantity)||1), 0);
            const making = db.filter(i => i.status === 'Making').reduce((s, i) => s + (parseInt(i.quantity)||1), 0);
            
            let studio = 0, sold = 0, unallocated = 0;
            let locStats = { 'Unallocated': 0, 'Sold': 0 };
            (appSettings.locations||[]).forEach(l => locStats[l] = 0);

            db.forEach(i => {
                const photos = normalizePhotos(i);
                photos.forEach(p => {
                    if (p.status === 'Sold') {
                        sold++; locStats['Sold']++;
                    } else {
                        if (p.locations && p.locations.length > 0) {
                            studio++;
                            p.locations.forEach(l => { if(locStats[l] !== undefined) locStats[l]++; });
                        } else {
                            unallocated++; locStats['Unallocated']++;
                        }
                    }
                });
            });

            document.getElementById('kpi-total').innerText = total;
            document.getElementById('kpi-making').innerText = making;
            document.getElementById('kpi-studio').innerText = studio;
            document.getElementById('kpi-unallocated').innerText = unallocated;
            document.getElementById('kpi-sold').innerText = sold;

            renderLocationStats(locStats);
            updateChart(locStats);
            renderCalendar();
        }

        function renderLocationStats(stats) {
            const c = document.getElementById('location-stats-container');
            c.innerHTML = '';
            Object.keys(stats).forEach(k => {
                if(stats[k] > 0) c.innerHTML += `<div class="bg-blue-50 text-blue-800 border border-blue-100 px-2 py-1 rounded text-[10px] font-bold">${k}: ${stats[k]}</div>`;
            });
        }

        // --- CALENDAR ---
        window.setCalendarMode = (m) => {
            calendarMode = m;
            document.getElementById('btn-mode-production').classList.toggle('text-stone-500', m!=='production');
            document.getElementById('btn-mode-production').classList.toggle('shadow', m==='production');
            document.getElementById('btn-mode-arrival').classList.toggle('text-stone-500', m!=='arrival');
            document.getElementById('btn-mode-arrival').classList.toggle('shadow', m==='arrival');
            renderCalendar();
        };
        window.changeMonth = (d) => { currentCalDate.setMonth(currentCalDate.getMonth()+d); renderCalendar(); };

        function renderCalendar() {
            const y = currentCalDate.getFullYear(), m = currentCalDate.getMonth();
            document.getElementById('calendar-month-label').innerText = currentCalDate.toLocaleString('en-US', {month:'short'});
            
            const container = document.getElementById('calendar-wrapper');
            container.innerHTML = `<div class="calendar-header">S</div><div class="calendar-header">M</div><div class="calendar-header">T</div><div class="calendar-header">W</div><div class="calendar-header">T</div><div class="calendar-header">F</div><div class="calendar-header">S</div>`;
            
            const firstDay = new Date(y, m, 1).getDay();
            const daysInMonth = new Date(y, m+1, 0).getDate();
            const today = new Date();

            for(let i=0; i<firstDay; i++) container.innerHTML += `<div class="calendar-cell bg-stone-50"></div>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                const isToday = (d===today.getDate() && m===today.getMonth() && y===today.getFullYear());
                let html = `<div class="calendar-cell ${isToday?'cal-today bg-amber-50':''}"><div class="cal-date-num">${d}</div>`;
                
                const items = db.filter(i => {
                    const date = calendarMode==='production' ? (i.makingAt?.seconds?new Date(i.makingAt.seconds*1000):null) : (i.completedAt?.seconds?new Date(i.completedAt.seconds*1000):null);
                    return date && date.getDate()===d && date.getMonth()===m && date.getFullYear()===y;
                });

                items.forEach(i => {
                    let cls = 'maker-other';
                    if(i.maker?.toLowerCase().includes('kim')) cls = 'maker-kim';
                    if(i.maker?.toLowerCase().includes('kelly')) cls = 'maker-kelly';
                    html += `<div class="cal-item ${cls}" onclick="window.openEditModal('${i.id}')">${i.itemName}</div>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            }
        }

        // --- PRODUCTION ---
        window.renderProductionList = function() {
            const tbody = document.getElementById('production-table-body');
            tbody.innerHTML = '';
            const mFilter = document.getElementById('prod-filter-maker').value;
            const cFilter = document.getElementById('prod-filter-category').value;

            db.forEach(i => {
                if(mFilter!=='all' && i.maker!==mFilter) return;
                const cleanCat = getCleanCategory(i.category);
                if(cFilter!=='all' && cleanCat!==cFilter) return;

                const tr = document.createElement('tr');
                tr.className = "border-b border-stone-50 hover:bg-stone-50";
                
                const photos = normalizePhotos(i);
                let reel = `<div class="photo-reel">`;
                if(photos.length===0) reel += `<div class="w-8 h-10 bg-stone-100 border text-[8px] flex items-center justify-center text-stone-300">No</div>`;
                else photos.forEach(p => reel += `<img src="${p.url}" class="reel-img" onclick="window.open('${p.url}')">`);
                reel += `</div>`;

                tr.innerHTML = `
                    <td class="px-4 py-3 align-top">
                        <div class="font-mono text-[10px] text-stone-400 mb-1">${i.month}</div>
                        ${reel}
                    </td>
                    <td class="px-4 py-3 align-top">
                        <div class="font-bold text-stone-800">${i.itemName}</div>
                        <div class="text-[10px] text-stone-500">${i.color||'-'} / ${i.size||'F'}</div>
                        <div class="text-[10px] bg-stone-100 inline-block px-1 rounded mt-1">${cleanCat}</div>
                    </td>
                    <td class="px-4 py-3 align-top text-[10px]">
                        <div>${i.maker}</div>
                        <div class="font-bold mt-1 text-stone-600">${i.status}</div>
                    </td>
                    <td class="px-4 py-3 text-right">
                        <button onclick="window.openEditModal('${i.id}')" class="text-stone-400 p-2"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        // --- ALLOCATION (CORE FIX) ---
        window.renderAllocationList = function() {
            const tbody = document.getElementById('allocation-table-body');
            tbody.innerHTML = '';
            const lFilter = document.getElementById('alloc-filter-location').value;
            const cFilter = document.getElementById('alloc-filter-category').value;

            const candidates = db.filter(i => ['Ready','Sold','Partial Sold','In Studio'].includes(i.status));

            candidates.forEach(item => {
                const cleanCat = getCleanCategory(item.category);
                if(cFilter!=='all' && cleanCat!==cFilter) return;

                const photos = normalizePhotos(item);
                let gridHtml = `<div class="photo-grid">`;
                let hasMatch = false;

                photos.forEach((p, idx) => {
                    let match = true;
                    if(lFilter==='Sold') match = (p.status==='Sold');
                    else if(lFilter==='Unallocated') match = (p.status!=='Sold' && (!p.locations || p.locations.length===0));
                    else if(lFilter!=='all') match = (p.locations && p.locations.includes(lFilter));

                    if(!match) return;
                    hasMatch = true;

                    const isSold = p.status==='Sold';
                    const badge = isSold?'SOLD':(p.locations?.length>0? (p.locations.length>1?'MULTI':p.locations[0].substring(0,5).toUpperCase()) :'NONE');
                    const badgeCls = isSold?'badge-sold':(p.locations?.length>0?'badge-multi':'badge-none');

                    gridHtml += `
                        <div class="grid-item" onclick="window.openDetailModal('${item.id}', ${idx})">
                            ${p.url?`<img src="${p.url}" class="grid-img ${isSold?'grayscale opacity-50':''}">`:`<div class="grid-img bg-stone-100 flex items-center justify-center text-[8px]">No Img</div>`}
                            <div class="status-badge ${badgeCls}">${badge}</div>
                            ${p.notes?`<div class="has-note-dot"></div>`:''}
                        </div>
                    `;
                });
                gridHtml += `</div>`;

                if((lFilter!=='all' && !hasMatch) || (lFilter==='all' && photos.length===0)) return;

                const tr = document.createElement('tr');
                tr.className = "border-b border-stone-50";
                tr.innerHTML = `
                    <td class="px-4 py-3">${gridHtml}</td>
                    <td class="px-4 py-3 align-top">
                        <div class="font-bold text-stone-800 text-xs">${item.itemName}</div>
                        <div class="text-[10px] text-stone-400">${cleanCat}</div>
                        <div class="text-[10px] text-stone-400">${item.color||'-'}</div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        // --- MODAL LOGIC ---
        window.openDetailModal = function(id, idx) {
            const item = db.find(i=>i.id===id);
            if(!item) return;
            currentDetailItem = item;
            currentDetailPhotoIdx = idx;
            
            const photos = normalizePhotos(item);
            const p = photos[idx];
            
            document.getElementById('detail-img').src = p.url || '';
            document.getElementById('detail-title').innerText = item.itemName;
            document.getElementById('detail-sku').innerText = `${item.category} / ${item.color}`;
            
            // Price Display
            let priceTxt = item.price ? `RM${item.price}` : '-';
            if(p.status === 'Sold') priceTxt += ` (Sold: RM${p.soldPrice||'-'})`;
            document.getElementById('detail-price-display').innerText = priceTxt;

            document.getElementById('detail-notes').value = p.notes || '';
            tempLocations = [...(p.locations || [])];

            const btnSold = document.getElementById('btn-toggle-sold');
            const isSold = p.status === 'Sold';
            btnSold.innerText = isSold ? "取消售出" : "標記為已售出";
            btnSold.className = isSold ? "flex-1 bg-red-100 text-red-600 py-3 rounded-lg text-xs font-bold" : "flex-1 bg-stone-800 text-white py-3 rounded-lg text-xs font-bold";
            document.getElementById('detail-sold-badge').classList.toggle('hidden', !isSold);

            renderDetailLocationButtons();
            
            document.getElementById('detail-modal').classList.remove('hidden');
            document.body.classList.add('modal-open'); // Lock Scroll
        };

        window.closeDetailModal = () => {
            document.getElementById('detail-modal').classList.add('hidden');
            document.body.classList.remove('modal-open');
        };

        window.renderDetailLocationButtons = () => {
            const c = document.getElementById('detail-location-options');
            c.innerHTML = '';
            const p = normalizePhotos(currentDetailItem)[currentDetailPhotoIdx];
            if(p.status === 'Sold') {
                c.innerHTML = `<span class="text-[10px] text-stone-400 col-span-2 text-center">已售出商品鎖定地點編輯</span>`;
                return;
            }
            (appSettings.locations||[]).forEach(l => {
                const active = tempLocations.includes(l);
                const btn = document.createElement('button');
                btn.className = `py-2 rounded border text-[10px] font-bold ${active?'bg-blue-600 text-white border-blue-600':'bg-white text-stone-500 border-stone-200'}`;
                btn.innerText = l;
                btn.onclick = () => {
                    if(active) tempLocations = tempLocations.filter(x=>x!==l); else tempLocations.push(l);
                    renderDetailLocationButtons();
                };
                c.appendChild(btn);
            });
        };

        window.saveItemDetails = async () => {
            if(!currentDetailItem) return;
            let photos = normalizePhotos(currentDetailItem);
            photos[currentDetailPhotoIdx].notes = document.getElementById('detail-notes').value;
            photos[currentDetailPhotoIdx].locations = tempLocations;
            await updateDoc(doc(dbFirestore, "stock_items", currentDetailItem.id), {photos});
            window.closeDetailModal();
        };

        window.triggerSoldFlow = () => {
             const p = normalizePhotos(currentDetailItem)[currentDetailPhotoIdx];
             if(p.status === 'Sold') {
                 if(confirm("取消售出？")) {
                     p.status = 'Available'; p.soldPrice = null; p.soldAt = null;
                     updateItemStatus(normalizePhotos(currentDetailItem)); // Refresh array
                     // Need to update actual object before saving? No, updateItemStatus uses currentDetailItem but we modify array in place? 
                     // Fix: we need to update the photo array in memory then call save.
                     let photos = normalizePhotos(currentDetailItem);
                     photos[currentDetailPhotoIdx] = p;
                     updateDoc(doc(dbFirestore, "stock_items", currentDetailItem.id), {photos, status: 'Ready'}).then(() => window.closeDetailModal());
                 }
             } else {
                 document.getElementById('sold-price-input').value = currentDetailItem.price || '';
                 document.getElementById('sold-date-input').valueAsDate = new Date();
                 document.getElementById('sold-modal').classList.remove('hidden');
             }
        };

        window.confirmSoldAction = async () => {
            let photos = normalizePhotos(currentDetailItem);
            let p = photos[currentDetailPhotoIdx];
            p.status = 'Sold';
            p.soldPrice = document.getElementById('sold-price-input').value;
            const d = document.getElementById('sold-date-input').value;
            p.soldAt = d ? new Date(d) : new Date();
            p.locations = tempLocations; // Save current locations as snapshot or clear? Usually keep record.

            document.getElementById('sold-modal').classList.add('hidden');
            
            const allSold = photos.every(x => x.status === 'Sold');
            const anySold = photos.some(x => x.status === 'Sold');
            const status = allSold ? 'Sold' : (anySold ? 'Partial Sold' : 'Ready');
            
            await updateDoc(doc(dbFirestore, "stock_items", currentDetailItem.id), {photos, status});
            window.closeDetailModal();
        };

        // --- ADD/EDIT/SETTINGS ---
        window.handleAddItem = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit'); btn.disabled=true; btn.innerText="Processing...";
            try {
                const fd = new FormData(e.target);
                const fi = document.querySelector('input[name="initialPhotos"]');
                let photos = [];
                if(fi.files.length>0) {
                    for(let i=0; i<fi.files.length; i++) {
                        const snap = await uploadBytes(ref(storage, 'p/'+Date.now()+'_'+fi.files[i].name), fi.files[i]);
                        photos.push({url: await getDownloadURL(snap.ref), status:'Available', locations:[]});
                    }
                }
                // Handle no photos but qty > 1
                if(photos.length===0 && parseInt(fd.get('quantity'))>0) {
                    photos = Array(parseInt(fd.get('quantity'))).fill({url:'', status:'Available', locations:[]});
                }

                await addDoc(collection(dbFirestore, "stock_items"), {
                    month: fd.get('month'), itemName: fd.get('itemName'), category: getCleanCategory(fd.get('category')),
                    maker: fd.get('maker'), color: fd.get('color'), price: fd.get('price'), quantity: parseInt(fd.get('quantity'))||1,
                    status: 'To Make', photos, createdAt: serverTimestamp()
                });
                document.getElementById('add-modal').classList.add('hidden');
                e.target.reset();
            } catch(e) { alert(e.message); }
            btn.disabled=false; btn.innerText="確認";
        };

        window.openModal = () => document.getElementById('add-modal').classList.remove('hidden');
        window.openEditModal = (id) => {
            const i = db.find(x=>x.id===id);
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-itemName').value = i.itemName;
            document.getElementById('edit-month').value = i.month;
            document.getElementById('edit-status').value = i.status;
            document.getElementById('edit-price').value = i.price;
            document.getElementById('edit-modal').classList.remove('hidden');
        };
        window.handleEditSubmit = async () => {
            const id = document.getElementById('edit-id').value;
            const item = db.find(x=>x.id===id);
            let data = {
                itemName: document.getElementById('edit-itemName').value,
                month: document.getElementById('edit-month').value,
                status: document.getElementById('edit-status').value,
                price: document.getElementById('edit-price').value
            };
            // Add Photos
            const fi = document.getElementById('edit-addPhotos');
            if(fi.files.length>0) {
                let photos = item.photos || [];
                for(let k=0; k<fi.files.length; k++) {
                     const snap = await uploadBytes(ref(storage, 'p/'+Date.now()+'_'+fi.files[k].name), fi.files[k]);
                     photos.push({url: await getDownloadURL(snap.ref), status:'Available', locations:[]});
                }
                data.photos = photos;
            }
            await updateDoc(doc(dbFirestore, "stock_items", id), data);
            document.getElementById('edit-modal').classList.add('hidden');
        };
        window.handleDelete = async () => {
            if(confirm("Delete?")) {
                await deleteDoc(doc(dbFirestore, "stock_items", document.getElementById('edit-id').value));
                document.getElementById('edit-modal').classList.add('hidden');
            }
        };

        window.addSetting = async (t) => {
            const el = document.getElementById(t==='makers'?'new-maker-input':(t==='locations'?'new-location-input':'new-category-input'));
            const v = el.value.trim();
            if(!v) return;
            const update = {}; update[t] = [...(appSettings[t]||[]), v];
            await updateDoc(doc(dbFirestore, "settings", "config"), update);
            el.value = '';
        };

        // --- UTILS ---
        function getCleanCategory(c) { return c ? c.trim().charAt(0).toUpperCase() + c.trim().slice(1) : 'Unknown'; }
        function normalizePhotos(i) {
            let arr = i.photos || (i.photo ? [i.photo] : []);
            if(arr.length === 0 && i.quantity > 0) arr = Array(parseInt(i.quantity)).fill({url:'', status:'Available'});
            return arr.map(p => typeof p === 'string' ? {url:p, status:'Available', locations:[]} : {url:p.url||'', status:p.status||'Available', locations:p.locations||[], notes:p.notes||'', soldPrice:p.soldPrice});
        }
        function updateDropdowns() {
            const fill = (cls, list) => document.querySelectorAll(cls).forEach(s => {
                const old = s.value;
                const isFilter = s.id.includes('filter');
                s.innerHTML = (isFilter?'<option value="all">All</option>':'') + list.map(x=>`<option value="${x}">${x}</option>`).join('');
                if(list.includes(old)) s.value = old;
            });
            fill('.dynamic-maker-select', appSettings.makers||[]);
            fill('.dynamic-category-select', (appSettings.categories||[]).map(getCleanCategory));
        }
        function renderSettingsView() {
            const r = (t) => document.getElementById(`settings-${t}-list`).innerHTML = (appSettings[t]||[]).map(x=>`<span class="bg-gray-100 text-xs px-2 py-1 rounded border mr-1 mb-1 inline-block">${x}</span>`).join('');
            r('makers'); r('locations'); r('categories');
        }
        
        window.switchView = (v) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`view-${v}`).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('nav-active'));
            document.getElementById(`nav-${v}`)?.classList.add('nav-active');
        };
        window.updateRole = () => {
            const r = document.getElementById('role-select').value;
            const isAdmin = r === 'admin';
            document.getElementById('nav-settings').classList.toggle('hidden', !isAdmin);
            document.getElementById('mobile-nav-settings').classList.toggle('hidden', !isAdmin);
            window.switchView(r.startsWith('maker')?'production':'dashboard');
        };

        function initChart() {
            const ctx = document.getElementById('allocationChart');
            if(!ctx) return;
            allocChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: [], datasets: [{ data: [], backgroundColor: ['#10b981','#3b82f6','#f59e0b','#6366f1','#ec4899'] }] },
                options: { maintainAspectRatio: false, plugins: { legend: { position:'right', labels:{boxWidth:10, font:{size:10}} } } }
            });
        }
        function updateChart(stats) {
            if(!allocChart) return;
            const labels = Object.keys(stats).filter(k=>stats[k]>0);
            const data = labels.map(k=>stats[k]);
            allocChart.data.labels = labels;
            allocChart.data.datasets[0].data = data;
            allocChart.update();
        }
        
        // Expose helpers globally
        window.normalizePhotos = normalizePhotos;
    </script>
</body>
</html>
