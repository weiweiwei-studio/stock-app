name: Bootstrap locked frontend assets

on:
  push:
    branches: [codex/static-tailwind-mobile-ci]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Generate lockfile and static CSS
        run: |
          npm install
          npm run build:css

      - name: Commit reproducible assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json styles.css
          git commit -m "Generate locked frontend assets"
          git push
